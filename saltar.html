<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura Hñähñu</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}




body {
    background: #eadcff;
    font-family: Arial, sans-serif;
    text-align: center;
}




h1 {
    color: #7026a5;
    margin: 15px;
}




#contenedor {
    width: 900px;
    max-width: 95%;
    margin: auto;
    position: relative;
}




canvas {
    width: 100%;
    background: linear-gradient(#c9a7ff, #f4cfff);
    border: 5px solid #7026a5;
    border-radius: 15px;
    display: block;
}




#menu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(80, 30, 120, 0.85);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    gap: 20px;
}




#menu h2 {
    font-size: 35px;
}




button {
    background: #ff72bb;
    border: none;
    padding: 15px 35px;
    border-radius: 15px;
    font-size: 20px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}




button:hover {
    background: #ff43a3;
}




p {
    margin: 12px;
    color: #7026a5;
    font-weight: bold;
}
</style>
</head>




<body>




<h1>🌸 AVENTURA HÑÄNHU 🌸</h1>




<div id="contenedor">




<canvas id="juego" width="900" height="500"></canvas>




<div id="menu">
    <h2 id="titulo">Aventura Hñähñu</h2>
    <p style="color:white">Recolecta corazones y llega a la meta.</p>
    <button onclick="iniciar()">JUGAR</button>
</div>




</div>




<p>⬅️ ➡️ Mover | ESPACIO Saltar</p>




<script>
const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const titulo = document.getElementById("titulo");




let jugador;
let plataformas;
let corazones;
let obstaculos;
let teclas = {};
let puntos = 0;
let vidas = 3;
let jugando = false;
let camara = 0;
let meta = 3500;




const gravedad = 0.6;




function iniciar() {
    puntos = 0;
    vidas = 3;
    camara = 0;




    jugador = {
        x: 50,
        y: 350,
        w: 35,
        h: 45,
        vx: 0,
        vy: 0,
        suelo: false
    };




    plataformas = [
        {x:0,y:430,w:400,h:70},
        {x:500,y:370,w:180,h:30},
        {x:780,y:320,w:180,h:30},
        {x:1100,y:400,w:300,h:70},
        {x:1500,y:340,w:200,h:30},
        {x:1800,y:290,w:180,h:30},
        {x:2100,y:420,w:350,h:70},
        {x:2600,y:350,w:200,h:30},
        {x:3000,y:400,w:600,h:70}
    ];




    corazones = [
        {x:250,y:350},
        {x:570,y:300},
        {x:850,y:250},
        {x:1200,y:330},
        {x:1550,y:280},
        {x:1850,y:230},
        {x:2200,y:350},
        {x:2650,y:290},
        {x:3200,y:330}
    ];




    obstaculos = [
        {x:600,y:345,w:30,h:25},
        {x:1250,y:375,w:35,h:25},
        {x:2250,y:395,w:35,h:25},
        {x:3150,y:375,w:35,h:25}
    ];




    jugador.x = 50;
    jugador.y = 350;




    jugando = true;
    menu.style.display = "none";




    actualizar();
}




// DIBUJAR JUGADOR
function dibujarJugador() {
    let x = jugador.x - camara;
    let y = jugador.y;




    // Cabello
    ctx.fillStyle = "#382044";
    ctx.fillRect(x+5,y,x+0?25:25,15);
    ctx.fillRect(x,y+10,35,25);




    // Cara
    ctx.fillStyle = "#f4c49c";
    ctx.fillRect(x+8,y+10,20,20);




    // Ojos
    ctx.fillStyle = "#222";
    ctx.fillRect(x+12,y+17,3,4);
    ctx.fillRect(x+22,y+17,3,4);




    // Blusa
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x+5,y+30,25,10);




    // Falda
    ctx.fillStyle = "#a64bd4";
    ctx.fillRect(x+2,y+38,31,7);




    // Piernas
    ctx.fillStyle = "#382044";
    ctx.fillRect(x+8,y+45,6,8);
    ctx.fillRect(x+22,y+45,6,8);




    // Moño
    ctx.fillStyle = "#ff69b4";
    ctx.fillRect(x+25,y+3,10,5);
}




// DIBUJAR ESCENARIO
function dibujarMundo() {
    ctx.clearRect(0,0,900,500);




    // Montañas
    ctx.fillStyle = "#b38be8";
    ctx.beginPath();
    ctx.moveTo(0,350);
    ctx.lineTo(200,100);
    ctx.lineTo(400,350);
    ctx.lineTo(600,120);
    ctx.lineTo(850,350);
    ctx.lineTo(900,250);
    ctx.lineTo(900,500);
    ctx.lineTo(0,500);
    ctx.fill();




    // Nubes
    ctx.fillStyle = "#fff1ff";
    ctx.fillRect(100,80,100,25);
    ctx.fillRect(130,60,60,25);
    ctx.fillRect(600,100,120,25);




    // Plataformas
    plataformas.forEach(p => {
        let x = p.x-camara;




        ctx.fillStyle = "#7b3f2a";
        ctx.fillRect(x,p.y,p.w,p.h);




        ctx.fillStyle = "#65d85c";
        ctx.fillRect(x,p.y,p.w,12);




        ctx.fillStyle = "#9bff83";
        for(let i=0;i<p.w;i+=20){
            ctx.fillRect(x+i,p.y-3,10,5);
        }
    });




    // Corazones
    corazones.forEach(c => {
        ctx.font = "30px Arial";
        ctx.fillText("💗",c.x-camara,c.y);
    });


    // Meta
    ctx.fillStyle = "#7131a5";
    ctx.fillRect(meta-camara,280,8,150);




    ctx.font = "40px Arial";
    ctx.fillText("🏁",meta-camara-20,280);




    dibujarJugador();




    // HUD
    ctx.fillStyle = "#6d299a";
    ctx.font = "bold 22px Arial";
    ctx.fillText("💗 Vidas: "+vidas,20,35);
    ctx.fillText("⭐ Puntos: "+puntos,700,35);
}




// COLISIONES
function colision(a,b) {
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
}




// ACTUALIZAR JUGADOR
function mover() {
    jugador.vx = 0;




    if(teclas["ArrowRight"]) jugador.vx = 5;
    if(teclas["ArrowLeft"]) jugador.vx = -5;




    jugador.x += jugador.vx;
    jugador.vy += gravedad;
    jugador.y += jugador.vy;




    jugador.suelo = false;




    plataformas.forEach(p => {
        if(colision(jugador,p) && jugador.vy >= 0 &&
           jugador.y+jugador.h-jugador.vy <= p.y+5) {




            jugador.y = p.y-jugador.h;
            jugador.vy = 0;
            jugador.suelo = true;
        }
    });




    // CAER
    if(jugador.y > 550) perderVida();




    // CORAZONES
    corazones = corazones.filter(c => {
        let objeto = {x:c.x,y:c.y,w:25,h:25};




        if(colision(jugador,objeto)) {
            puntos += 10;
            return false;
        }
        return true;
    });




    // OBSTACULOS
    obstaculos.forEach(o => {
        if(colision(jugador,o)) perderVida();
    });




    // META
    if(jugador.x >= meta) finalizar(true);




    // CAMARA
    camara = jugador.x-200;
    if(camara < 0) camara = 0;
}




// PERDER VIDA
function perderVida() {
    vidas--;




    jugador.x -= 80;
    jugador.y = 300;
    jugador.vy = 0;




    if(vidas <= 0) finalizar(false);
}




// FINAL
function finalizar(victoria) {
    jugando = false;
    menu.style.display = "flex";




    if(victoria) {
        titulo.innerText = "🎉 ¡GANASTE! 🎉";
    } else {
        titulo.innerText = "💔 GAME OVER";
    }




    menu.querySelector("p").innerText =
        "Puntuación final: "+puntos;




    menu.querySelector("button").innerText = "VOLVER A JUGAR";
}




// BUCLE
function actualizar() {
    if(!jugando) return;




    mover();
    dibujarMundo();




    requestAnimationFrame(actualizar);
}




// TECLADO
document.addEventListener("keydown", e => {
    teclas[e.key] = true;




    if(e.code === "Space" && jugador && jugador.suelo) {
        jugador.vy = -13;
        jugador.suelo = false;
    }
});




document.addEventListener("keyup", e => {
    teclas[e.key] = false;
});




// INICIO
dibujarMundo();
</script>




</body>
</html>
