<script>


// VARIABLES GLOBALES
let puntaje = 0;
let respuestaSeleccionada = "";


// ACTUALIZAR PUNTAJE EN PANTALLA
function actualizarPuntaje(){
    document.getElementById("puntaje").textContent = puntaje;
}


// SELECCIONAR RESPUESTA
function seleccionarRespuesta(respuesta, elemento){


    respuestaSeleccionada = respuesta;


    // Quitar selección anterior
    const tarjetas = document.querySelectorAll(".card");
    tarjetas.forEach(card => card.classList.remove("seleccionada"));


    // Marcar tarjeta seleccionada
    elemento.classList.add("seleccionada");
}


// VERIFICAR RESPUESTA
function comprobar(correcta, siguienteFuncion){


    if(respuestaSeleccionada === ""){
        alert("Selecciona una respuesta primero");
        return;
    }


    if(respuestaSeleccionada === correcta){


        puntaje += 10;
        actualizarPuntaje();


        alert("✅ ¡Correcto! +10 puntos");


    }else{


        alert("❌ Incorrecto");


    }


    respuestaSeleccionada = "";


    // avanzar a la siguiente lección
    window[siguienteFuncion]();
}


// AUDIOS
function reproducirAudio1(){
    const audio = document.getElementById("audio1");
    audio.currentTime = 0;
    audio.play();
}


function reproducirAudio2(){
    const audio = document.getElementById("audio2");
    audio.currentTime = 0;
    audio.play();
}


function reproducirAudio3(){
    const audio = document.getElementById("audio3");
    audio.currentTime = 0;
    audio.play();
}


function reproducirAudio4(){
    const audio = document.getElementById("audio4");
    audio.currentTime = 0;
    audio.play();
}


// NAVEGACIÓN
function mostrarleccion2(){
    document.getElementById("leccion1").style.display = "none";
    document.getElementById("leccion2").style.display = "block";
}


function mostrarleccion3(){
    document.getElementById("leccion2").style.display = "none";
    document.getElementById("leccion3").style.display = "block";
}


function mostrarleccion4(){
    document.getElementById("leccion3").style.display = "none";
    document.getElementById("leccion4").style.display = "block";
}


function mostrarleccion5(){
    document.getElementById("leccion4").style.display = "none";
    document.getElementById("leccion5").style.display = "block";
}


// PANTALLA FINAL
function mostrarFinal(){


   fetch("actualizar_progreso.php", {


        method: "POST",


        headers: {
            "Content-Type": "application/json"
        },


        body: JSON.stringify({
            experienciaGanada: puntaje
        })


    })
    .then(response => response.json())
    .then(data => {


        if(data.success){


            alert(
                "🎉 ¡Felicidades!\n\n" +
                "Ganaste " + puntaje +
                " puntos de experiencia."
            );


            window.location.href = "index.html";


        }else{


            alert(data.mensaje);


        }


    })
    .catch(error => {


        console.error(error);
        alert("Error al actualizar el progreso");


    });






}


</script>
